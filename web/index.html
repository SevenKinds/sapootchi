<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sapootchi</title>
  <!-- Mobile: fill the screen, no pinch-zoom, no scroll/bounce. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #202533; /* matches the game's gradient bottom */
      overflow: hidden;
      touch-action: none;            /* gestures belong to the game */
      -webkit-user-select: none; user-select: none;
    }
    canvas { display: block; }

    /* HTML overlays the WASM canvas can't draw itself (ad iframe, PayPal
       button). Positioned by the game over the Settings screen; hidden
       otherwise. touch-action/user-select re-enabled so they stay tappable. */
    .ov {
      position: fixed; display: none; box-sizing: border-box;
      z-index: 10; touch-action: auto;
      -webkit-user-select: auto; user-select: auto;
      align-items: center; justify-content: center; overflow: hidden;
    }
  </style>
</head>
<body>
  <!-- Overlay lives BEFORE the canvas ebiten appends, and sits above it via z-index. -->
  <div id="donate-slot" class="ov"></div>

  <!-- Bridge the game (WASM) calls to place/hide the HTML overlays. -->
  <script>
    (function () {
      function canvasEl() { return document.querySelector('canvas'); }
      window.sapootchiOverlay = {
        // Map a design-space rect (360x640) onto the game content. Ebiten
        // letterboxes the framebuffer inside the canvas — preserving aspect and
        // centering (black bars on the wide side) — so we must match that: one
        // uniform scale + the centering offset, NOT width/360 by height/640.
        place: function (id, dx, dy, dw, dh) {
          var c = canvasEl(), el = document.getElementById(id);
          if (!c || !el) return;
          var r = c.getBoundingClientRect();
          var scale = Math.min(r.width / 360, r.height / 640);
          var ox = r.left + (r.width - 360 * scale) / 2;
          var oy = r.top + (r.height - 640 * scale) / 2;
          el.style.display = 'flex';
          el.style.left = (ox + dx * scale) + 'px';
          el.style.top = (oy + dy * scale) + 'px';
          el.style.width = (dw * scale) + 'px';
          el.style.height = (dh * scale) + 'px';
        },
        hide: function () {
          var el = document.getElementById('donate-slot');
          if (el) el.style.display = 'none';
        }
      };
    })();
  </script>

  <!-- PayPal Donate SDK: https://developer.paypal.com/sdk/donate/ -->
  <script src="https://www.paypalobjects.com/donate/sdk/donate-sdk.js" charset="UTF-8"></script>
  <script>
    (function () {
      if (!window.PayPal || !PayPal.Donation) return;
      PayPal.Donation.Button({
        env: 'production',
        hosted_button_id: 'L9V5FMCXE4HME',
        image: {
          src: 'https://www.paypalobjects.com/en_US/i/btn/btn_donate_LG.gif',
          alt: 'Donate with PayPal button',
          title: 'PayPal - The safer, easier way to pay online!'
        }
      }).render('#donate-slot');
    })();
  </script>

  <script src="wasm_exec.js"></script>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("sapootchi.wasm"), go.importObject)
      .then((result) => go.run(result.instance))
      .catch((err) => {
        document.body.innerHTML =
          '<p style="color:#edeff5;font-family:sans-serif;padding:2em">Failed to load: ' + err + "</p>";
      });
  </script>
</body>
</html>
